<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLENG GO - Ojek & Food Delivery Lengkong Sukabumi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0D1729; color: #F8FAFC; }
        .bg-navy-dark { background-color: #0D1729; }
        .bg-card-navy { background-color: #1C2A40; }
        .text-gold { color: #FFD12A; }
        .bg-gold { background-color: #FFD12A; }
        .border-gold { border-color: #FFD12A; }
    </style>
</head>
<body class="bg-navy-dark min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container Utama Aplikasi -->
    <div id="app" class="w-full max-w-md bg-card-navy rounded-2xl shadow-2xl p-6 border border-slate-800">
        
        <!-- HEADER / BRANDING -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gold">🛵 OLENG GO</h1>
            <p class="text-xs text-slate-400 mt-1">Super-App Kecamatan Lengkong, Sukabumi (SIMADU)</p>
        </div>

        <!-- HALAMAN LOGIN / AUTH -->
        <div id="login-section" class="space-y-4">
            <h2 class="text-lg font-semibold text-slate-200">Masuk / Masukkan Akun</h2>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Nomor WhatsApp Admin / User</label>
                <input type="text" id="login-phone" placeholder="Contoh: 085624736602" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-gold text-sm">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Pilih Peran (Role)</label>
                <select id="login-role" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-gold text-sm">
                    <option value="customer">Customer (Pengguna)</option>
                    <option value="driver">Driver (Ojol)</option>
                    <option value="merchant">Merchant (Toko / Kuliner)</option>
                    <option value="admin">Admin Master</option>
                </select>
            </div>
            <button onclick="handleLogin()" class="w-full py-3 bg-gold text-slate-950 font-bold rounded-xl shadow-lg hover:bg-yellow-400 transition-all text-sm mt-2">
                Masuk Aplikasi
            </button>
            <div class="text-center mt-3">
                <span class="text-xs text-slate-400">Top-up Saldo via Admin WhatsApp: </span>
                <a href="https://wa.me/6285624736602" target="_blank" class="text-xs text-gold font-semibold underline">085624736602</a>
            </div>
        </div>

        <!-- DASHBOARD UTAMA (MULTI-ROLE & FITUR LENGKAP) -->
        <div id="dashboard-section" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800">
                <div>
                    <h3 id="user-welcome" class="text-sm font-bold text-white">Halo, Pengguna</h3>
                    <p id="user-role-badge" class="text-xs text-gold font-medium uppercase">Customer</p>
                </div>
                <button onclick="handleLogout()" class="px-3 py-1.5 bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-xs font-semibold hover:bg-red-500/30 transition-all">
                    Log Out
                </button>
            </div>

            <!-- Fitur Navigasi / Layanan Utama -->
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-800 space-y-3">
                <p class="text-xs text-slate-300 text-center">📍 Wilayah Layanan: <span class="text-gold font-bold">Kecamatan Lengkong, Sukabumi</span></p>
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="alert('Fitur Lengkong Ojek Aktif!')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-white border border-slate-700 transition-all text-left">
                        🚀 Lengkong Ojek
                    </button>
                    <button onclick="alert('Fitur Lengkong Food Aktif!')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-white border border-slate-700 transition-all text-left">
                        🍜 Lengkong Food
                    </button>
                </div>
            </div>

            <!-- Panel Khusus / Voucher Info -->
            <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 flex justify-between items-center">
                <span class="text-xs text-slate-400">Voucher Diskon Aktif:</span>
                <span class="text-xs font-bold text-gold px-2 py-1 bg-slate-800 rounded-lg border border-slate-700">LENGKONGHEBAT</span>
            </div>

            <!-- Peta Leaflet GPS Lengkong -->
            <div class="space-y-1">
                <label class="text-xs text-slate-400">Peta & Lokasi Real-time GPS</label>
                <div id="map" class="w-full h-44 rounded-xl border border-slate-700 z-0"></div>
            </div>
        </div>

    </div>

    <!-- SCRIPT APLIKASI & LOCALSTORAGE PERSISTENT SESSION -->
    <script>
        // Cek Sesi Tersimpan saat Halaman Dimuat / Reload
        document.addEventListener("DOMContentLoaded", function() {
            const savedSession = localStorage.getItem('oleng_user_session');
            if (savedSession) {
                const userData = JSON.parse(savedSession);
                showDashboard(userData);
            } else {
                showLogin();
            }
        });

        function handleLogin() {
            const phone = document.getElementById('login-phone').value.trim();
            const role = document.getElementById('login-role').value;

            if (!phone) {
                alert('Silakan masukkan nomor WhatsApp Anda terlebih dahulu!');
                return;
            }

            const userData = { phone: phone, role: role };
            // Simpan sesi ke memori browser agar tidak hilang saat reload
            localStorage.setItem('oleng_user_session', JSON.stringify(userData));
            
            showDashboard(userData);
        }

        function showDashboard(user) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            
            document.getElementById('user-welcome').innerText = `No. WA: ${user.phone}`;
            document.getElementById('user-role-badge').innerText = `Role: ${user.role}`;

            // Inisialisasi Peta Leaflet GPS (Pusat Kecamatan Lengkong, Sukabumi)
            setTimeout(() => {
                if (!window.mapInstance) {
                    window.mapInstance = L.map('map').setView([-7.155, 106.855], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(window.mapInstance);
                    L.marker([-7.155, 106.855]).addTo(window.mapInstance)
                        .bindPopup('Pusat Layanan OLENG GO Lengkong')
                        .openPopup();
                } else {
                    window.mapInstance.invalidateSize();
                }
            }, 300);
        }

        function showLogin() {
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        function handleLogout() {
            // Hapus sesi tersimpan sehingga pengguna wajib login kembali saat reload berikutnya
            localStorage.removeItem('oleng_user_session');
            document.getElementById('login-phone').value = '';
            showLogin();
        }
    </script>
</body>
</html>
