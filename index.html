            ],
            orders: [
                { id: 'ORD-9021', type: 'food', customer: 'Budi Santoso', merchant: 'Warung Nasi Sunda Lengkong', merchantLat: -7.1240, merchantLng: 106.8460, items: 'Nasi Liwet (2x)', total: 55000, status: 'Menunggu Driver', address: 'Kp. Lengkong RT 02/01', destLat: -7.1250, destLng: 106.8470, ongkir: 5000, driver: 'Asep Supriatna' }

        };

        let db = JSON.parse(localStorage.getItem('oleng_go_db')) || defaultDB;

        function saveDB() {
            localStorage.setItem('oleng_go_db', JSON.stringify(db));
        }

        document.addEventListener("DOMContentLoaded", function() {
            const savedSession = localStorage.getItem('oleng_user_session');
            if (savedSession) {
                try {
                    currentUser = JSON.parse(savedSession);
                    enterDashboard();
                } catch (e) {
                    localStorage.removeItem('oleng_user_session');
                }
            }
        });

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            return Math.round((R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))) * 10) / 10;
        }

        function calculateShippingCost(distanceKm) {
            return Math.max(5000, Math.round((4000 + (distanceKm * 2500)) / 500) * 500);
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');

            if(tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                loginBtn.className = "flex-1 font-bold text-center text-sky-600 border-b-2 border-sky-600 pb-1 text-sm cursor-pointer";
                regBtn.className = "flex-1 font-semibold text-center text-slate-400 pb-1 text-sm cursor-pointer";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                regBtn.className = "flex-1 font-bold text-center text-sky-600 border-b-2 border-sky-600 pb-1 text-sm cursor-pointer";
                loginBtn.className = "flex-1 font-semibold text-center text-slate-400 pb-1 text-sm cursor-pointer";
                setTimeout(initRegisterMap, 200);
            }
        }

        function onRegisterRoleChange(role) {
            document.getElementById('reg-driver-fields').classList.toggle('hidden', role !== 'driver');
            const mFields = document.getElementById('reg-merchant-fields');
            mFields.classList.toggle('hidden', role !== 'merchant');
            if(role === 'merchant') setTimeout(initRegisterMap, 200);
        }

        function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const role = document.getElementById('login-role').value;
            
            let foundUser = db.users.find(u => u.phone === identifier && u.role === role);
            if(!foundUser) {
                foundUser = {
                    id: Date.now(),
                    name: identifier,
                    phone: identifier,
                    role: role,
                    status: 'Aktif',
                    address: 'Kecamatan Lengkong, Sukabumi',
                    balance: 100000,
                    password: '123',
                    photo: 'https://placehold.co/150x150/0284c7/ffffff?text=' + identifier.charAt(0)
                };
                db.users.push(foundUser);
                saveDB();
            }

            currentUser = foundUser;
            adminViewMode = null;
            localStorage.setItem('oleng_user_session', JSON.stringify(currentUser));
            showToast(`Berhasil masuk sebagai ${role.toUpperCase()}!`, 'success');
            enterDashboard();
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const role = document.getElementById('reg-role').value;
            const password = document.getElementById('reg-password').value;

            let extraData = {};
            if(role === 'merchant') {
                extraData.shopName = document.getElementById('reg-shopname').value || 'Toko Baru Lengkong';
                extraData.lat = parseFloat(document.getElementById('reg-merchant-lat').value);
                extraData.lng = parseFloat(document.getElementById('reg-merchant-lng').value);
            }

            const newUser = {
                id: Date.now(), name, phone, role, status: 'Aktif', address: 'Lengkong Sukabumi', balance: 100000, password, photo: 'https://placehold.co/150x150/0284c7/ffffff?text=' + name.charAt(0), ...extraData
            };
            db.users.push(newUser);
            if(role === 'merchant') {
                db.merchants.push({ id: Date.now(), name: newUser.shopName, category: 'Kuliner', status: 'Buka', banner: 'https://placehold.co/600x300/0284c7/ffffff?text=Banner', image: 'https://placehold.co/150x150/0284c7/ffffff?text=Toko', rating: 5.0, lat: newUser.lat, lng: newUser.lng, address: 'Lengkong', operationalHours: '09:00 - 21:00', whatsapp: phone, balance: 50000 });
            }
            saveDB();
            currentUser = newUser;
            localStorage.setItem('oleng_user_session', JSON.stringify(currentUser));
            showToast('Akun berhasil didaftarkan!', 'success');
            enterDashboard();
        }

        function handleLogout() {
            currentUser = null;
            adminViewMode = null;
            localStorage.removeItem('oleng_user_session');
            document.getElementById('view-auth').classList.remove('hidden');
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-merchant-detail').classList.add('hidden');
            showToast('Anda telah keluar.', 'info');
        }

        function enterDashboard() {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            const switcherBar = document.getElementById('admin-switcher-bar');
            if(currentUser.role === 'admin') {
                switcherBar.classList.remove('hidden');
                adminViewMode = 'admin';
            } else {
                switcherBar.classList.add('hidden');
                adminViewMode = null;
            }
            updateDashboardShell();
        }

        function updateDashboardShell() {
            const activeRole = (currentUser.role === 'admin' && adminViewMode) ? adminViewMode : currentUser.role;
            renderDashboardNavigation(activeRole);
            let defaultTab = 'home';
            if(activeRole === 'driver') defaultTab = 'driver-orders';
            else if(activeRole === 'merchant') defaultTab = 'merchant-menu';
            else if(activeRole === 'admin') defaultTab = 'admin-dash';
            renderDashboardContent(defaultTab);
        }

        function adminSwitchViewMode(mode) {
            adminViewMode = mode;
            ['customer', 'driver', 'merchant', 'admin'].forEach(m => {
                const btn = document.getElementById(`mode-btn-${m}`);
                if(btn) btn.className = m === mode ? "px-2.5 py-1 bg-sky-600 text-white rounded-lg text-[10px] font-extrabold shadow cursor-pointer" : "px-2.5 py-1 bg-slate-800 hover:bg-sky-600 text-slate-300 rounded-lg text-[10px] font-extrabold cursor-pointer";
            });
            updateDashboardShell();
        }

        function checkAccessAndNavigate(targetFeature) {
            renderDashboardContent(targetFeature);
            return true;
        }

        function renderDashboardNavigation(activeRole) {
            const nav = document.getElementById('bottom-nav');
            if(activeRole === 'admin') {
                nav.innerHTML = `
                    <button onclick="checkAccessAndNavigate('admin-dash')" class="flex flex-col items-center py-1 px-2 text-sky-600 font-bold cursor-pointer" id="nav-btn-admin-dash"><i class="fa-solid fa-chart-pie text-base"></i><span class="text-[8px] mt-1">Monitor</span></button>
                    <button onclick="checkAccessAndNavigate('admin-users')" class="flex flex-col items-center py-1 px-2 text-slate-400 hover:text-sky-600 cursor-pointer" id="nav-btn-admin-users"><i class="fa-solid fa-users-gear text-base"></i><span class="text-[8px] mt-1">User</span></button>
                    <button onclick="checkAccessAndNavigate('home')" class="flex flex-col items-center py-1 px-2 text-white cursor-pointer"><div class="w-11 h-11 bg-sky-600 rounded-full flex items-center justify-center text-white shadow-lg -mt-4 border-2 border-white"><i class="fa-solid fa-house text-base"></i></div></button>
                    <button onclick="checkAccessAndNavigate('admin-stores')" class="flex flex-col items-center py-1 px-2 text-slate-400 hover:text-sky-600 cursor-pointer" id="nav-btn-admin-stores"><i class="fa-solid fa-store text-base"></i><span class="text-[8px] mt-1">Toko</span></button>
                    <button onclick="checkAccessAndNavigate('admin-drivers')" class="flex flex-col items-center py-1 px-2 text-slate-400 hover:text-sky-600 cursor-pointer" id="nav-btn-admin-drivers"><i class="fa-solid fa-motorcycle text-base"></i><span class="text-[8px] mt-1">Ojek</span></button>
                `;
            } else {
                nav.innerHTML = `
                    <button onclick="checkAccessAndNavigate('food')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-600 cursor-pointer" id="nav-btn-food"><i class="fa-solid fa-utensils text-base"></i><span class="text-[10px] mt-1">Pesanan</span></button>
                    <button onclick="checkAccessAndNavigate('ojek')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-600 cursor-pointer" id="nav-btn-ojek"><i class="fa-solid fa-motorcycle text-base"></i><span class="text-[10px] mt-1">Ojek</span></button>
                    <button onclick="checkAccessAndNavigate('home')" class="flex flex-col items-center py-1 px-3 text-white cursor-pointer" id="nav-btn-home"><div class="w-12 h-12 bg-sky-600 rounded-full flex items-center justify-center text-white shadow-lg -mt-5 border-4 border-white"><i class="fa-solid fa-house text-lg"></i></div></button>
                    <button onclick="switchView('chat')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-600 cursor-pointer"><i class="fa-solid fa-comments text-base"></i><span class="text-[10px] mt-1">Chat</span></button>
                    <button onclick="checkAccessAndNavigate('profile')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-600 cursor-pointer" id="nav-btn-profile"><i class="fa-solid fa-user text-base"></i><span class="text-[10px] mt-1">Akun</span></button>
                `;
            }
        }

        function renderDashboardContent(tab) {
            if (mapInstance) { mapInstance.remove(); mapInstance = null; }
            if (checkoutMapInstance) { checkoutMapInstance.remove(); checkoutMapInstance = null; }
            currentSubTab = tab;
            document.getElementById('view-merchant-detail').classList.add('hidden');
            const container = document.getElementById('main-content');
            const activeRole = (currentUser.role === 'admin' && adminViewMode) ? adminViewMode : currentUser.role;

            if(activeRole === 'admin' && tab.startsWith('admin-')) {
                if(tab === 'admin-dash') renderAdminDash(container);
                else if(tab === 'admin-users') renderAdminUsers(container);
                else renderAdminDash(container);
            } else {
                if(tab === 'home') renderCustomerHome(container);
                else if(tab === 'food') renderCustomerFood(container);
                else if(tab === 'ojek') renderCustomerOjek(container);
                else if(tab === 'merchant-menu') renderMerchantMenu(container);
                else if(tab === 'merchant-edit') renderMerchantProfileEdit(container);
                else if(tab === 'profile') renderProfile(container);
                else renderCustomerHome(container);
            }
        }

        function renderCustomerHome(container) {
            container.innerHTML = `
                <div class="p-4 space-y-4 bg-gradient-to-b from-sky-600 to-slate-50 min-h-full pb-20">
                    <!-- Banner Kustom SIMADU -->
                    <div class="bg-gradient-to-r from-sky-500 via-blue-600 to-sky-700 p-2 rounded-3xl shadow-xl border-2 border-yellow-400 relative overflow-hidden flex items-center justify-between text-white">
                        <div class="p-2 space-y-1 z-10">
                            <span class="bg-yellow-400 text-slate-900 text-[9px] font-black px-2 py-0.5 rounded-md uppercase">Resmi Warga Lengkong</span>
                            <h2 class="text-xl font-black italic tracking-wider text-yellow-300 drop-shadow">OLENG GO</h2>
                            <p class="text-[11px] font-bold text-sky-100">Ojek Online & Kuliner UMKM Lengkong</p>
                        </div>
                        <div class="text-4xl px-3 bg-yellow-400/20 rounded-2xl py-2 border border-yellow-300/40">🐝</div>
                    </div>

                    <div class="bg-gradient-to-r from-sky-700 to-sky-900 text-white p-4 rounded-3xl shadow-xl flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <img src="${currentUser.photo}" class="w-12 h-12 rounded-2xl object-cover border-2 border-yellow-400">
                            <div>
                                <span class="text-[11px] text-sky-200 font-extrabold">Halo, ${currentUser.name}</span>
                                <h3 class="text-base font-black">Rp ${(currentUser.balance || 100000).toLocaleString()}</h3>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openNotificationModal()" class="p-2.5 bg-sky-800 rounded-2xl text-white cursor-pointer"><i class="fa-solid fa-bell"></i></button>
                            <button onclick="switchView('chat')" class="p-2.5 bg-sky-800 rounded-2xl text-white cursor-pointer"><i class="fa-solid fa-comments"></i></button>
                            <button onclick="handleLogout()" class="p-2.5 bg-rose-600 rounded-2xl text-white cursor-pointer"><i class="fa-solid fa-power-off"></i></button>
                        </div>
                    </div>

                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="checkAccessAndNavigate('ojek')" class="bg-white p-3 rounded-2xl shadow-xs flex flex-col items-center justify-center cursor-pointer">
                            <div class="w-12 h-12 bg-sky-100 text-sky-700 rounded-2xl flex items-center justify-center text-xl mb-1"><i class="fa-solid fa-motorcycle"></i></div>
                            <span class="text-[10px] font-extrabold text-slate-800">Ojek</span>
                        </button>
                        <button onclick="checkAccessAndNavigate('food')" class="bg-white p-3 rounded-2xl shadow-xs flex flex-col items-center justify-center cursor-pointer">
                            <div class="w-12 h-12 bg-yellow-100 text-yellow-700 rounded-2xl flex items-center justify-center text-xl mb-1"><i class="fa-solid fa-utensils"></i></div>
                            <span class="text-[10px] font-extrabold text-slate-800">Food</span>
                        </button>
                        <button onclick="switchView('chat')" class="bg-white p-3 rounded-2xl shadow-xs flex flex-col items-center justify-center cursor-pointer">
                            <div class="w-12 h-12 bg-blue-100 text-blue-700 rounded-2xl flex items-center justify-center text-xl mb-1"><i class="fa-solid fa-comments"></i></div>
                            <span class="text-[10px] font-extrabold text-slate-800">Chat</span>
                        </button>
                        <button onclick="openNotificationModal()" class="bg-white p-3 rounded-2xl shadow-xs flex flex-col items-center justify-center cursor-pointer">
                            <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center text-xl mb-1"><i class="fa-solid fa-gift"></i></div>
                            <span class="text-[10px] font-extrabold text-slate-800">Info</span>
                        </button>
                    </div>

                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 space-y-2">
                        <div class="flex justify-between items-center">
                            <h3 class="font-extrabold text-xs text-slate-800 uppercase"><i class="fa-solid fa-map-location-dot text-sky-600 mr-1"></i> Peta Wilayah Lengkong</h3>
                            <span class="text-[10px] bg-sky-100 text-sky-800 px-2 py-0.5 rounded-full font-extrabold">GPS Aktif</span>
                        </div>
                        <div id="map" class="map-container shadow-inner"></div>
                    </div>

                    <div class="space-y-3">
                        <h3 class="font-extrabold text-sm text-slate-900">Daftar Toko Kuliner Pilihan</h3>
                        <div class="space-y-3">
                            ${db.merchants.map(m => `
                                <div onclick="openMerchantDetail(${m.id})" class="bg-white p-3.5 rounded-2xl shadow-xs border border-slate-100 flex items-center space-x-3.5 cursor-pointer">
                                    <img src="${m.image}" class="w-16 h-16 rounded-2xl object-cover shadow-xs">
                                    <div class="flex-1">
                                        <h4 class="font-bold text-xs text-slate-900">${m.name}</h4>
                                        <p class="text-[11px] text-slate-500">${m.category} • <span class="text-emerald-600 font-bold">${m.status}</span></p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            setTimeout(initMap, 200);
        }

        function renderCustomerFood(container) {
            container.innerHTML = `
                <div class="p-4 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="font-extrabold text-base text-slate-900">OLENG Food Lengkong</h2>
                        <button onclick="openCartModal()" class="bg-sky-600 text-white px-3.5 py-2 rounded-2xl text-xs font-extrabold shadow-md cursor-pointer">
                            <i class="fa-solid fa-cart-shopping"></i> Keranjang (<span id="cart-counter">${db.cart.length}</span>)
                        </button>
                    </div>
                    <div class="space-y-3">
                        ${db.merchants.map(m => `
                            <div onclick="openMerchantDetail(${m.id})" class="bg-white p-4 rounded-3xl border border-slate-100 shadow-xs cursor-pointer space-y-2">
                                <h4 class="font-bold text-sm text-slate-900">${m.name}</h4>
                                <p class="text-xs text-slate-500"><i class="fa-solid fa-location-dot"></i> ${m.address}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openMerchantDetail(merchantId) {
            const merchant = db.merchants.find(m => m.id === merchantId);
            db.activeMerchant = merchant;
            const foods = db.foods.filter(f => f.merchantId === merchantId);
            const detailView = document.getElementById('view-merchant-detail');
            detailView.classList.remove('hidden');

            detailView.innerHTML = `
                <div class="bg-sky-700 text-white p-4 flex items-center justify-between">
                    <button onclick="document.getElementById('view-merchant-detail').classList.add('hidden')" class="text-white font-bold cursor-pointer"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
                    <h3 class="font-bold text-sm">${merchant.name}</h3>
                </div>
                <div class="p-4 space-y-3 overflow-y-auto flex-1 pb-20">
                    <div class="bg-white p-4 rounded-3xl shadow-xs space-y-3">
                        <h4 class="font-black text-sm text-slate-900">Menu Makanan</h4>
                        <div class="space-y-2">
                            ${foods.map(f => `
                                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-2xl border border-slate-100">
                                    <div>
                                        <h5 class="font-bold text-xs text-slate-900">${f.name}</h5>
                                        <span class="text-xs font-black text-sky-600">Rp ${f.price.toLocaleString()}</span>
                                    </div>
                                    <button onclick="addToCart(${f.id})" class="px-3 py-2 bg-yellow-400 rounded-xl text-xs font-black shadow-xs cursor-pointer">+</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function addToCart(foodId) {
            db.cart.push(db.foods.find(f => f.id === foodId));
            showToast('Menu ditambahkan ke keranjang!', 'success');
            document.getElementById('cart-counter').innerText = db.cart.length;
        }

        function openCartModal() {
            document.getElementById('modal-cart').classList.remove('hidden');
            const container = document.getElementById('cart-items-container');
            container.innerHTML = db.cart.map((item, idx) => `
                <div class="flex justify-between items-center text-xs py-1">
                    <span>${item.name}</span>
                    <span class="font-bold text-sky-600">Rp ${item.price.toLocaleString()}</span>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">Keranjang kosong</p>';
            const subtotal = db.cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('cart-subtotal').innerText = 'Rp ' + subtotal.toLocaleString();
            document.getElementById('cart-total').innerText = 'Rp ' + (subtotal + 5000).toLocaleString();
            setTimeout(initCheckoutMap, 200);
        }

        function closeCartModal() { document.getElementById('modal-cart').classList.add('hidden'); }

        function submitOrder() {
            if(db.cart.length === 0) return showToast('Keranjang kosong!', 'error');
            db.orders.unshift({ id: 'ORD-' + Math.floor(1000+Math.random()*9000), type: 'food', customer: currentUser.name, total: 55000, status: 'Menunggu Driver' });
            db.cart = [];
            saveDB();
            closeCartModal();
            showToast('Pesanan berhasil dibuat!', 'success');
        }

        function renderCustomerOjek(container) {
            container.innerHTML = `
                <div class="p-4 space-y-4">
                    <h2 class="font-extrabold text-base text-slate-900">Pesan Ojek Online</h2>
                    <div class="bg-white p-4 rounded-3xl shadow-xs border border-slate-100 space-y-3">
                        <input type="text" id="ojek-to" placeholder="Tujuan di Lengkong..." class="w-full p-2.5 border rounded-2xl text-xs font-semibold">
                        <button onclick="showToast('Ojek dipesan!', 'success')" class="w-full py-3 bg-sky-600 text-white font-extrabold rounded-2xl text-xs cursor-pointer shadow-md">Pesan Sekarang</button>
                    </div>
                </div>
            `;
        }

        function renderMerchantMenu(container) {
            container.innerHTML = `
                <div class="p-4 space-y-4 pb-20">
                    <h2 class="font-extrabold text-base text-slate-900">Kelola Menu Toko</h2>
                    <button onclick="openAddMenuModal()" class="bg-yellow-400 text-slate-900 px-3.5 py-2 rounded-2xl text-xs font-extrabold cursor-pointer">+ Tambah Menu</button>
                    <div class="space-y-3">
                        ${db.foods.map(f => `
                            <div class="bg-white p-3 rounded-2xl border flex justify-between items-center text-xs font-bold">
                                <span>${f.name} (Rp ${f.price.toLocaleString()})</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openAddMenuModal() {
            const name = prompt('Nama Makanan:');
            if(!name) return;
            const price = parseInt(prompt('Harga (Rp):', '15000')) || 15000;
            db.foods.push({ id: Date.now(), merchantId: 1, name, price, desc: 'Enak', stock: 20, image: 'https://placehold.co/200x200/0284c7/ffffff?text=' + encodeURIComponent(name) });
            saveDB();
            showToast('Menu baru ditambahkan!', 'success');
            renderDashboardContent('merchant-menu');
        }

        function renderMerchantProfileEdit(container) {
            container.innerHTML = `<div class="p-4"><h2 class="font-extrabold text-base">Profil Toko</h2></div>`;
        }

        function renderAdminDash(container) {
            container.innerHTML = `
                <div class="p-4 space-y-4">
                    <h2 class="font-extrabold text-base text-slate-900">Panel Admin Master Control</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-3xl border"><span class="text-xs text-slate-500">Total User</span><h3 class="text-xl font-black text-sky-600">${db.users.length}</h3></div>
                        <div class="bg-white p-4 rounded-3xl border"><span class="text-xs text-slate-500">Total Toko</span><h3 class="text-xl font-black text-yellow-500">${db.merchants.length}</h3></div>
                    </div>
                </div>
            `;
        }

        function renderAdminUsers(container) { renderAdminDash(container); }

        function renderProfile(container) {
            container.innerHTML = `
                <div class="p-4 space-y-4">
                    <div class="bg-white p-5 rounded-3xl text-center space-y-3 border">
                        <img src="${currentUser.photo}" class="w-20 h-20 rounded-2xl mx-auto border-2 border-sky-500 object-cover">
                        <h2 class="font-extrabold text-sm text-slate-900">${currentUser.name}</h2>
                        <p class="text-xs text-sky-600 font-bold uppercase">${currentUser.role}</p>
                    </div>
                </div>
            `;
        }

        function openNotificationModal() {
            document.getElementById('modal-notif').classList.remove('hidden');
            document.getElementById('notification-list').innerHTML = db.notifications.map(n => `<div class="p-3 bg-slate-50 rounded-2xl text-xs"><b>${n.title}</b><p>${n.desc}</p></div>`).join('');
        }
        function closeNotificationModal() { document.getElementById('modal-notif').classList.add('hidden'); }

        function switchView(view) {
            if(view === 'chat') {
                document.getElementById('view-chat').classList.remove('hidden');
                renderChatContacts();
                renderPersonalChatMessages();
            }
        }
        function closeChat() { document.getElementById('view-chat').classList.add('hidden'); }

        function renderChatContacts() {
            const container = document.getElementById('chat-contact-selector');
            const contacts = ['Admin SIMADU', ...db.merchants.map(m => m.name)];
            container.innerHTML = contacts.map(n => `<button onclick="activeChatTarget='${n}';renderPersonalChatMessages();" class="px-3 py-1.5 rounded-xl text-xs font-bold ${activeChatTarget===n?'bg-sky-600 text-white':'bg-white border'}">${n}</button>`).join('');
        }

        function renderPersonalChatMessages() {
            const container = document.getElementById('chat-messages');
            document.getElementById('chat-title').innerText = `Chat: ${activeChatTarget}`;
            const thread = db.chats.filter(c => c.from === currentUser.name || c.to === currentUser.name);
            container.innerHTML = thread.length ? thread.map(c => `<div class="p-2 rounded-xl text-xs bg-sky-100">${c.text}</div>`).join('') : '<p class="text-xs text-slate-400 text-center py-4">Mulai percakapan...</p>';
        }

        function sendPersonalChatMessage() {
            const input = document.getElementById('chat-input');
            if(!input.value.trim()) return;
            db.chats.push({ id: Date.now(), from: currentUser.name, to: activeChatTarget, text: input.value, time: 'Baru saja' });
            saveDB();
            input.value = '';
            renderPersonalChatMessages();
        }

        function showToast(msg, type='success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-2xl shadow-xl text-white text-xs font-extrabold ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function initMap() {
            const mapEl = document.getElementById('map');
            if(!mapEl) return;
            if(mapInstance) mapInstance.remove();
            mapInstance = L.map('map', { zoomControl: false }).setView([-7.1234, 106.8456], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
            L.marker([-7.1234, 106.8456]).addTo(mapInstance).bindPopup('Pusat Lengkong').openPopup();
        }

        function initCheckoutMap() {
            const mapEl = document.getElementById('checkout-map');
            if(!mapEl) return;
            if(checkoutMapInstance) checkoutMapInstance.remove();
            checkoutMapInstance = L.map('checkout-map', { zoomControl: false }).setView(pickupLatLng, 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(checkoutMapInstance);
            L.marker(pickupLatLng).addTo(checkoutMapInstance);
        }

        function initRegisterMap() {
            const mapEl = document.getElementById('register-store-map');
            if(!mapEl) return;
            if(registerMapInstance) registerMapInstance.remove();
            registerMapInstance = L.map('register-store-map', { zoomControl: false }).setView([-7.1234, 106.8456], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(registerMapInstance);
            L.marker([-7.1234, 106.8456], {draggable: true}).addTo(registerMapInstance);
        }
    </script>
</body>
</html>
