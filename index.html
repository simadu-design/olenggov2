                setTimeout(() => {

            setTimeout(hideOlengSplashScreen, 1600);

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const ADMIN_MAIN_WA = '6285624736602';
        const SUPABASE_URL = 'https://yhyjofvdkmuudpqzucnw.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_EFykp9Q2vKT3U_8KcIw8oQ_orxoyX1h';
        const supabaseClient = (window.supabase && typeof window.supabase.createClient === 'function')
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
            : null;

        let currentUser = null;
        let currentSubTab = 'home';
        let adminViewMode = null;
        let activeChatTarget = 'Admin SIMADU';
        let alarmEnabled = localStorage.getItem('oleng_alarm_enabled') !== 'false';
        let readChatIds = JSON.parse(localStorage.getItem('oleng_read_chat_ids') || '[]');
        let readNotifIds = JSON.parse(localStorage.getItem('oleng_read_notif_ids') || '[]');
        let shownPopupOrderIds = JSON.parse(localStorage.getItem('oleng_shown_popup_orders') || '[]');
        let shownPopupChatIds = JSON.parse(localStorage.getItem('oleng_shown_popup_chats') || '[]');
        let mapInstance = null;
        let userCurrentLatLng = [-7.1234, 106.8456];
        let realtimeChannel = null;

        const defaultDB = {
            users: [
                { id: 1, name: 'Budi Santoso', phone: '085611112222', role: 'customer', password: '123456', address: 'Lengkong, Sukabumi' },
                { id: 2, name: 'Asep Supriatna', phone: '085622223333', role: 'driver', password: '123456', status: 'Online', vehicle: 'Honda Beat - F 4321 ABC', lat: -7.1235, lng: 106.8458 },
                { id: 3, name: 'MADU TOKO', phone: '085633334444', role: 'merchant', shopName: 'MADU TOKO', password: '123456', status: 'Buka', address: 'Jl. Raya Lengkong No. 12', lat: -7.1240, lng: 106.8460 },
                { id: 4, name: 'Admin SIMADU', phone: '085624736602', role: 'admin', password: '123456', address: 'Lengkong, Sukabumi' }
            ],
            merchants: [
                { id: 1, name: 'MADU TOKO', status: 'Buka', address: 'Jl. Raya Lengkong No. 12', lat: -7.1240, lng: 106.8460, whatsapp: '085633334444' }
            ],
            drivers: [
                { id: 1, name: 'Asep Supriatna', status: 'Online', vehicle: 'Honda Beat - F 4321 ABC', lat: -7.1235, lng: 106.8458, phone: '085622223333' }
            ],
            orders: [],
            chats: [],
            notifications: []
        };

        let db = JSON.parse(localStorage.getItem('oleng_go_db')) || defaultDB;

        function normalizePhone(p) {
            let d = String(p || '').replace(/\D/g, '');
            if (d.startsWith('62')) d = '0' + d.slice(2);
            else if (d.startsWith('8')) d = '0' + d;
            return d;
        }
        function normKey(v) { return String(v || '').trim().toLowerCase().replace(/\s+/g, ' '); }
        function saveLocal() { localStorage.setItem('oleng_go_db', JSON.stringify(db)); }

        function playAlarmRingtone() {
            if (!alarmEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                [880, 1174.66, 880].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    const t = ctx.currentTime + idx * 0.14;
                    osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(0.15, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.13);
                });
            } catch (e) {}
        }

        function toggleNotificationAlarm() {
            alarmEnabled = !alarmEnabled;
            localStorage.setItem('oleng_alarm_enabled', String(alarmEnabled));
            const el = document.getElementById('chat-alarm-state');
            if (el) el.textContent = alarmEnabled ? 'ON' : 'OFF';
            showToast(`Alarm notifikasi ${alarmEnabled ? 'AKTIF' : 'MATI'}`, 'info');
            if (currentUser && !document.getElementById('view-dashboard').classList.contains('hidden')) {
                renderDashboardContent(currentSubTab);
            }
        }

        function showToast(msg, type = 'success') {
            if (type !== 'info') playAlarmRingtone();
            const box = document.getElementById('toast-container');
            const div = document.createElement('div');
            const colorClass = type === 'error' ? 'bg-red-600' : type === 'info' ? 'bg-zinc-900 border border-orange-500' : 'bg-orange-600';
            div.className = `px-4 py-3 rounded-2xl shadow-xl text-white text-xs font-extrabold ${colorClass}`;
            div.textContent = msg;
            box.appendChild(div);
            setTimeout(() => div.remove(), 2500);
        }

        function getPartnerKeys() {
            const names = new Set();
            const phones = new Set();
            if (!currentUser) return { names, phones };
            [currentUser.name, currentUser.shopName].forEach(n => { if (normKey(n)) names.add(normKey(n)); });
            if (normalizePhone(currentUser.phone)) phones.add(normalizePhone(currentUser.phone));
            (db.merchants || []).forEach(m => {
                if (normalizePhone(m.whatsapp) === normalizePhone(currentUser.phone) || normKey(m.name) === normKey(currentUser.shopName)) {
                    if (normKey(m.name)) names.add(normKey(m.name));
                }
            });
            (db.drivers || []).forEach(d => {
                if (normalizePhone(d.phone) === normalizePhone(currentUser.phone) || normKey(d.name) === normKey(currentUser.name)) {
                    if (normKey(d.name)) names.add(normKey(d.name));
                }
            });
            return { names, phones };
        }

        function isMessageForMe(msg) {
            if (!currentUser || !msg) return false;
            const { names, phones } = getPartnerKeys();
            const fromK = normKey(msg.from);
            const fromP = normalizePhone(msg.from);
            const toK = normKey(msg.to);
            const toP = normalizePhone(msg.to);
            if (!fromK || names.has(fromK) || (fromP && phones.has(fromP))) return false;
            const role = (currentUser.role === 'admin' && adminViewMode) ? adminViewMode : currentUser.role;
            if (role === 'admin') return toK === 'admin simadu' || toK === 'admin' || toP === '085624736602';
            return names.has(toK) || (toP && phones.has(toP));
        }

        function isOrderForMe(order) {
            if (!currentUser || !order) return false;
            const role = (currentUser.role === 'admin' && adminViewMode) ? adminViewMode : currentUser.role;
            if (role === 'admin') return true;
            const { names, phones } = getPartnerKeys();
            if (role === 'customer') return names.has(normKey(order.customer));
            if (role === 'driver') {
                const drvK = normKey(order.driver);
                const drvP = normalizePhone(order.assignedDriverPhone);
                return (drvK && names.has(drvK)) || (drvP && phones.has(drvP)) || (!drvK && order.status === 'searching_driver');
            }
            if (role === 'merchant') return names.has(normKey(order.merchant));
            return false;
        }

        function getMyNotifs() {
            if (!currentUser) return [];
            const { names } = getPartnerKeys();
            const role = (currentUser.role === 'admin' && adminViewMode) ? adminViewMode : currentUser.role;
            return (db.notifications || []).filter(n => {
                if (role === 'admin') return true;
                return n.target === 'ALL' || names.has(normKey(n.target));
            });
        }

        function updateBadges() {
            const nUnread = getMyNotifs().filter(n => !readNotifIds.includes(String(n.id))).length;
            const cUnread = (db.chats || []).filter(c => isMessageForMe(c) && !readChatIds.includes(String(c.id))).length;
            const nb = document.getElementById('home-notif-badge');
            const cb = document.getElementById('home-chat-badge');
            if (nb) { nb.textContent = String(nUnread); nb.classList.toggle('hidden', nUnread <= 0); }
            if (cb) { cb.textContent = String(cUnread); cb.classList.toggle('hidden', cUnread <= 0); }
        }

        function openNotificationModal() {
            const list = getMyNotifs();
            readNotifIds = Array.from(new Set([...readNotifIds, ...list.map(x => String(x.id))]));
            localStorage.setItem('oleng_read_notif_ids', JSON.stringify(readNotifIds));
            updateBadges();
            const container = document.getElementById('notification-list');
            container.innerHTML = list.length ? list.map(n => `
                <div class="p-3 rounded-2xl bg-zinc-50 border border-zinc-200 text-xs space-y-1">
                    <div class="flex justify-between font-black text-zinc-950">
                        <span>${n.title}</span>
                        <span class="text-[10px] text-orange-600">${n.time || ''}</span>
                    </div>
                    <p class="text-zinc-700">${n.desc}</p>
                </div>
            `).join('') : '<p class="text-xs text-zinc-500 text-center py-4">Belum ada notifikasi.</p>';
            document.getElementById('modal-notif').classList.remove('hidden');
        }

        function closeNotificationModal() {
            document.getElementById('modal-notif').classList.add('hidden');
        }

        function showOrderPopup(order) {
            if (!order || !isOrderForMe(order)) return;
            playAlarmRingtone();
            const card = document.getElementById('incoming-order-card');
            card.innerHTML = `
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="bg-orange-600 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase">POP-UP ORDER (${order.id})</span>
                    <button onclick="document.getElementById('modal-incoming-order').classList.add('hidden')" class="text-zinc-500 text-xl font-bold cursor-pointer">&times;</button>
                </div>
                <div class="text-xs space-y-1 bg-zinc-50 p-3 rounded-2xl border border-zinc-200">
                    <p class="font-black text-zinc-950">${order.merchant || 'Layanan Ojek'}</p>
                    <p>Pemesan: <b>${order.customer}</b></p>
                    <p>Detail: <b>${order.items}</b></p>
                    <p class="text-orange-600 font-black pt-1">Total: Rp ${Number(order.total || 0).toLocaleString()}</p>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="acceptOrderPopup('${order.id}')" class="py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-black cursor-pointer">TERIMA</button>
                    <button onclick="document.getElementById('modal-incoming-order').classList.add('hidden')" class="py-2.5 bg-zinc-950 text-white rounded-xl text-xs font-black cursor-pointer">TUTUP</button>
                </div>
            `;
            document.getElementById('modal-incoming-order').classList.remove('hidden');
        }

        function acceptOrderPopup(orderId) {
            const ord = (db.orders || []).find(o => o.id === orderId);
            if (ord) {
                ord.status = 'driver_assigned';
                if (currentUser && currentUser.role === 'driver') ord.driver = currentUser.name;
                saveLocal();
                syncToSupabase();
                showToast(`Order ${orderId} diterima`, 'success');
            }
            document.getElementById('modal-incoming-order').classList.add('hidden');
            renderDashboardContent(currentSubTab);
        }

        function showChatPopup(msg) {
            if (!msg || !isMessageForMe(msg)) return;
            const k = String(msg.id);
            if (shownPopupChatIds.includes(k)) return;
            shownPopupChatIds.push(k);
            localStorage.setItem('oleng_shown_popup_chats', JSON.stringify(shownPopupChatIds.slice(-100)));
            playAlarmRingtone();
            const safeFrom = String(msg.from || 'Pengguna').replace(/'/g, "\\'");
            const card = document.getElementById('incoming-chat-card');
            card.innerHTML = `
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="bg-zinc-950 text-orange-400 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase">CHAT MASUK</span>
                    <button onclick="document.getElementById('modal-incoming-chat').classList.add('hidden')" class="text-zinc-500 text-xl font-bold cursor-pointer">&times;</button>
                </div>
                <div class="text-xs space-y-1.5">
                    <p class="font-black text-zinc-950">Dari: ${msg.from}</p>
                    <p class="bg-zinc-50 p-3 rounded-2xl border border-zinc-200 font-semibold">"${msg.text}"</p>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="document.getElementById('modal-incoming-chat').classList.add('hidden'); openChat('${safeFrom}')" class="py-2.5 bg-orange-600 text-white rounded-xl text-xs font-black cursor-pointer">BALAS CHAT</button>
                    <button onclick="document.getElementById('modal-incoming-chat').classList.add('hidden')" class="py-2.5 bg-zinc-200 text-zinc-900 rounded-xl text-xs font-black cursor-pointer">TUTUP</button>
                </div>
            `;
            document.getElementById('modal-incoming-chat').classList.remove('hidden');
        }

        function switchAuthTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('form-login').classList.toggle('hidden', !isLogin);
            document.getElementById('form-register').classList.toggle('hidden', isLogin);
            document.getElementById('tab-login-btn').className = isLogin
                ? 'flex-1 font-extrabold text-center text-orange-600 border-b-2 border-orange-600 pb-1.5 text-sm cursor-pointer'
                : 'flex-1 font-bold text-center text-zinc-400 pb-1.5 text-sm cursor-pointer';
            document.getElementById('tab-register-btn').className = !isLogin
                ? 'flex-1 font-extrabold text-center text-orange-600 border-b-2 border-orange-600 pb-1.5 text-sm cursor-pointer'
                : 'flex-1 font-bold text-center text-zinc-400 pb-1.5 text-sm cursor-pointer';
        }

        function toggleRegisterRoleFields() {
            const r = document.getElementById('reg-role').value;
            document.getElementById('reg-driver-fields').classList.toggle('hidden', r !== 'driver');
            document.getElementById('reg-merchant-fields').classList.toggle('hidden', r !== 'merchant');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = normalizePhone(document.getElementById('login-phone').value);
            const pass = document.getElementById('login-password').value.trim();
            const role = document.getElementById('login-role').value;
            await pullFromSupabase();
            let u = db.users.find(x => normalizePhone(x.phone) === phone && x.role === role);
            if (!u && phone === '085624736602' && role === 'admin') {
                u = defaultDB.users[3];
            }
            if (!u || String(u.password || '123456') !== pass) {
                return showToast('Nomor HP, sandi, atau peran tidak sesuai', 'error');
            }
            currentUser = { ...u };
            adminViewMode = role === 'admin' ? 'admin' : null;
            localStorage.setItem('oleng_user_session', JSON.stringify(currentUser));
            enterDashboard();
        }

        async function handleRegister(e) {
            e.preventDefault();
            const role = document.getElementById('reg-role').value;
            const phone = normalizePhone(document.getElementById('reg-phone').value);
            const name = document.getElementById('reg-name').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            if (phone.length < 9 || !name || !password) return showToast('Lengkapi data wajib', 'error');
            const shopName = document.getElementById('reg-merchant-shop')?.value.trim() || name;
            const address = document.getElementById('reg-merchant-address')?.value.trim() || 'Lengkong, Sukabumi';
            const plate = document.getElementById('reg-driver-plate')?.value.trim().toUpperCase() || '';
            const bike = document.getElementById('reg-driver-bike')?.value.trim() || '';

            const newUser = { id: Date.now(), name, phone, role, password, address, shopName };
            db.users.unshift(newUser);
            if (role === 'merchant') {
                db.merchants.push({ id: Date.now() + 1, name: shopName, status: 'Buka', address, lat: -7.1240, lng: 106.8460, whatsapp: phone });
            } else if (role === 'driver') {
                db.drivers.push({ id: Date.now() + 1, name, status: 'Online', vehicle: `${bike || 'Motor'} ${plate}`.trim(), lat: -7.1235, lng: 106.8458, phone });
            }
            saveLocal();
            await syncToSupabase();
            switchAuthTab('login');
            document.getElementById('login-phone').value = phone;
            document.getElementById('login-role').value = role;
            showToast('Akun terdaftar, silakan masuk', 'success');
        }

        function enterDashboard() {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('admin-switcher-bar').classList.toggle('hidden', currentUser.role !== 'admin');
            renderNav();
            renderDashboardContent(currentSubTab || 'home');
            updateBadges();
            const pendingOrd = (db.orders || []).find(o => o.status !== 'completed' && isOrderForMe(o));
            if (pendingOrd && !shownPopupOrderIds.includes(pendingOrd.id)) {
                shownPopupOrderIds.push(pendingOrd.id);
                localStorage.setItem('oleng_shown_popup_orders', JSON.stringify(shownPopupOrderIds));
                showOrderPopup(pendingOrd);
            }
        }

        function adminSwitchViewMode(mode) {
            adminViewMode = mode;
            renderNav();
            renderDashboardContent(mode === 'admin' ? 'home' : 'orders');
        }

        function renderNav() {
            const role = (currentUser.role === 'admin' && adminViewMode) ? adminViewMode : currentUser.role;
            const nav = document.getElementById('bottom-nav');
            nav.innerHTML = `
                <button onclick="renderDashboardContent('home')" class="flex flex-col items-center py-1 px-3 text-orange-400 font-extrabold cursor-pointer">
                    <i class="fa-solid fa-house text-sm"></i><span class="text-[10px] mt-1">Beranda</span>
                </button>
                <button onclick="renderDashboardContent('orders')" class="flex flex-col items-center py-1 px-3 text-white hover:text-orange-400 font-bold cursor-pointer">
                    <i class="fa-solid fa-receipt text-sm"></i><span class="text-[10px] mt-1">Order (${role})</span>
                </button>
                <button onclick="openChat('${role === 'admin' ? (db.users[0]?.name || 'Budi Santoso') : 'Admin SIMADU'}')" class="flex flex-col items-center py-1 px-3 text-white hover:text-orange-400 font-bold cursor-pointer">
                    <i class="fa-solid fa-comments text-sm"></i><span class="text-[10px] mt-1">Chat</span>
                </button>
                <button onclick="logoutApp()" class="flex flex-col items-center py-1 px-3 text-red-400 font-bold cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket text-sm"></i><span class="text-[10px] mt-1">Keluar</span>
                </button>
            `;
        }

        function logoutApp() {
            currentUser = null;
            localStorage.removeItem('oleng_user_session');
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-auth').classList.remove('hidden');
        }

        function renderDashboardContent(tab) {
            currentSubTab = tab;
            if (mapInstance) { mapInstance.remove(); mapInstance = null; }
            const main = document.getElementById('main-content');
            if (tab === 'orders') {
                const mine = (db.orders || []).filter(o => isOrderForMe(o));
                main.innerHTML = `
                    <div class="p-4 space-y-3 pb-24">
                        <h2 class="font-black text-base text-zinc-950">Daftar Order</h2>
                        ${mine.length ? mine.map(o => `
                            <div class="p-4 rounded-2xl border-2 border-zinc-200 bg-white space-y-1.5 text-xs">
                                <div class="flex justify-between font-black">
                                    <span class="text-orange-600">${o.id}</span>
                                    <span class="px-2 py-0.5 rounded bg-zinc-950 text-white text-[10px]">${o.status}</span>
                                </div>
                                <p class="font-bold text-zinc-950">${o.merchant || 'Ojek'} • ${o.items}</p>
                                <p class="text-zinc-600">Pemesan: ${o.customer} • Driver: ${o.driver || '-'}</p>
                                <p class="font-black text-zinc-950">Rp ${Number(o.total || 0).toLocaleString()}</p>
                            </div>
                        `).join('') : '<p class="text-xs text-zinc-500 text-center py-6">Belum ada order.</p>'}
                    </div>
                `;
                return;
            }

            main.innerHTML = `
                <div class="p-4 space-y-4 pb-24">
                    <div class="bg-zinc-950 text-white p-4 rounded-3xl border-2 border-orange-500 flex items-center justify-between">
                        <div>
                            <span class="text-[10px] text-orange-400 font-extrabold uppercase block">AKUN AKTIF</span>
                            <h2 class="font-black text-sm">${currentUser.name} (${currentUser.phone})</h2>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openNotificationModal()" class="relative px-3 py-2 bg-orange-600 text-white rounded-2xl text-xs font-black cursor-pointer">
                                <i class="fa-solid fa-bell"></i>
                                <span id="home-notif-badge" class="ml-1 bg-zinc-950 text-orange-400 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
                            </button>
                            <button onclick="openChat('Admin SIMADU')" class="relative px-3 py-2 bg-white text-zinc-950 rounded-2xl text-xs font-black cursor-pointer">
                                <i class="fa-solid fa-comments"></i>
                                <span id="home-chat-badge" class="ml-1 bg-orange-600 text-white px-1.5 py-0.5 rounded-full text-[10px]">0</span>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between bg-zinc-100 px-3.5 py-2 rounded-2xl text-xs">
                        <button onclick="toggleNotificationAlarm()" class="font-black text-zinc-950 cursor-pointer">
                            <i class="fa-solid fa-volume-high text-orange-600 mr-1"></i> Alarm: ${alarmEnabled ? 'ON' : 'OFF'}
                        </button>
                        <button onclick="manualForceSync(true)" id="home-supabase-badge" class="font-black text-orange-700 cursor-pointer">
                            Sinkron Supabase
                        </button>
                    </div>

                    <div class="bg-white p-4 rounded-3xl border-2 border-orange-500 space-y-2.5">
                        <h3 class="font-black text-xs text-zinc-950 uppercase">Buat Order Cepat (Uji Pop-Up Mitra)</h3>
                        <select id="quick-target-role" class="w-full p-2.5 border-2 border-zinc-200 rounded-2xl text-xs font-bold bg-white">
                            ${(db.merchants || []).map(m => `<option value="merchant:${m.name}">Toko: ${m.name}</option>`).join('')}
                            ${(db.drivers || []).map(d => `<option value="driver:${d.name}">Driver: ${d.name}</option>`).join('')}
                        </select>
                        <input type="text" id="quick-order-note" placeholder="Contoh: Nasi Liwet 1 / Antar ke Alun-Alun" class="w-full p-2.5 border-2 border-zinc-200 rounded-2xl text-xs font-semibold bg-white">
                        <button onclick="createQuickOrder()" class="w-full py-3 bg-orange-600 hover:bg-orange-700 text-white font-black rounded-2xl text-xs cursor-pointer">
                            Kirim Order Sekarang
                        </button>
                    </div>

                    <div class="bg-white p-3 rounded-3xl border-2 border-zinc-200 space-y-2">
                        <h3 class="font-black text-xs text-zinc-950 uppercase">Peta Lengkong, Sukabumi</h3>
                        <div id="map" class="map-container"></div>
                    </div>
                </div>
            `;
            updateBadges();
            setTimeout(() => {
                const el = document.getElementById('map');
                if (!el) return;
                mapInstance = L.map('map').setView(userCurrentLatLng, 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapInstance);
                setTimeout(() => mapInstance && mapInstance.invalidateSize(), 250);
            }, 200);
        }

        function createQuickOrder() {
            const sel = document.getElementById('quick-target-role').value;
            const note = document.getElementById('quick-order-note').value.trim() || 'Pesanan OLENG GO';
            const [kind, targetName] = sel.split(':');
            const newOrder = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customer: currentUser.name,
                merchant: kind === 'merchant' ? targetName : 'Layanan Ojek Online',
                driver: kind === 'driver' ? targetName : (db.drivers[0]?.name || 'Asep Supriatna'),
                items: note,
                total: 15000,
                status: 'searching_driver'
            };
            db.orders.unshift(newOrder);
            db.notifications.unshift({
                id: Date.now(),
                target: targetName,
                title: `Order Baru ${newOrder.id}`,
                desc: `${note} dari ${currentUser.name}`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            saveLocal();
            syncToSupabase();
            showToast(`Order ${newOrder.id} dikirim ke ${targetName}`, 'success');
            renderDashboardContent('orders');
        }

        function openChat(targetName) {
            activeChatTarget = targetName;
            const unreadFromTarget = (db.chats || []).filter(c => normKey(c.from) === normKey(targetName)).map(c => String(c.id));
            readChatIds = Array.from(new Set([...readChatIds, ...unreadFromTarget]));
            localStorage.setItem('oleng_read_chat_ids', JSON.stringify(readChatIds));
            updateBadges();
            document.getElementById('view-chat').classList.remove('hidden');
            document.getElementById('chat-alarm-state').textContent = alarmEnabled ? 'ON' : 'OFF';
            renderChatContacts();
            renderChatMessages();
        }

        function closeChat() {
            document.getElementById('view-chat').classList.add('hidden');
            updateBadges();
        }

        function renderChatContacts() {
            const contacts = Array.from(new Set([
                'Admin SIMADU',
                ...(db.merchants || []).map(m => m.name),
                ...(db.drivers || []).map(d => d.name),
                ...(db.users || []).map(u => u.name)
            ])).filter(n => n && normKey(n) !== normKey(currentUser?.name));

            document.getElementById('chat-contact-selector').innerHTML = contacts.map(name => `
                <button type="button" onclick="openChat('${name.replace(/'/g, "\\'")}')" class="w-full px-4 py-2 text-left text-xs font-extrabold flex justify-between items-center cursor-pointer ${normKey(activeChatTarget) === normKey(name) ? 'bg-orange-100 text-zinc-950' : 'bg-white text-zinc-800'}">
                    <span>${name}</span>
                    <span class="text-[10px] text-orange-600">Chat</span>
                </button>
            `).join('');
        }

        function renderChatMessages() {
            document.getElementById('chat-title').textContent = `Chat: ${activeChatTarget}`;
            const me = normKey(currentUser?.name);
            const target = normKey(activeChatTarget);
            const msgs = (db.chats || []).filter(c => {
                const f = normKey(c.from);
                const t = normKey(c.to);
                return (f === me && t === target) || (f === target && t === me);
            });
            const box = document.getElementById('chat-messages');
            box.innerHTML = msgs.map(c => {
                const mine = normKey(c.from) === me;
                return `<div class="p-3 rounded-2xl text-xs max-w-[80%] ${mine ? 'bg-orange-600 text-white ml-auto' : 'bg-white border border-zinc-200 text-zinc-950 mr-auto'}"><b>${c.from}</b><p class="mt-0.5">${c.text}</p><span class="text-[9px] opacity-75 block mt-1">${c.time || ''}</span></div>`;
            }).join('') || '<p class="text-xs text-zinc-500 text-center py-6">Mulai chat...</p>';
            box.scrollTop = box.scrollHeight;
        }

        function sendPersonalChatMessage() {
            const inp = document.getElementById('chat-input');
            const text = inp.value.trim();
            if (!text || !currentUser) return;
            inp.value = '';
            const msg = {
                id: Date.now(),
                from: currentUser.name,
                to: activeChatTarget,
                text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            db.chats.push(msg);
            readChatIds.push(String(msg.id));
            localStorage.setItem('oleng_read_chat_ids', JSON.stringify(readChatIds));
            saveLocal();
            renderChatMessages();
            syncToSupabase();
        }

        async function syncToSupabase() {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('app_config').upsert({
                    id: 1,
                    state_json: {
                        chats: db.chats || [],
                        notifications: db.notifications || [],
                        updatedAt: Date.now()
                    }
                }, { onConflict: 'id' });
            } catch (e) {}
        }

        async function pullFromSupabase() {
            if (!supabaseClient) return;
            try {
                const { data } = await supabaseClient.from('app_config').select('*').eq('id', 1).maybeSingle();
                if (data?.state_json) {
                    const prevChatIds = new Set((db.chats || []).map(x => String(x.id)));
                    if (Array.isArray(data.state_json.chats)) {
                        const map = new Map((db.chats || []).map(x => [String(x.id), x]));
                        data.state_json.chats.forEach(x => map.set(String(x.id), x));
                        db.chats = Array.from(map.values());
                    }
                    if (Array.isArray(data.state_json.notifications)) {
                        const map = new Map((db.notifications || []).map(x => [String(x.id), x]));
                        data.state_json.notifications.forEach(x => map.set(String(x.id), x));
                        db.notifications = Array.from(map.values());
                    }
                    saveLocal();
                    updateBadges();
                    const newestChat = (db.chats || []).find(c => !prevChatIds.has(String(c.id)) && isMessageForMe(c));
                    if (newestChat) showChatPopup(newestChat);
                    if (!document.getElementById('view-chat').classList.contains('hidden')) renderChatMessages();
                }
            } catch (e) {}
        }

        async function manualForceSync(notify = false) {
            await pullFromSupabase();
            await syncToSupabase();
            if (notify) showToast('Sinkronisasi selesai', 'success');
        }

        function initRealtime() {
            if (!supabaseClient || realtimeChannel) return;
            realtimeChannel = supabaseClient
                .channel('oleng-orange-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'app_config' }, () => pullFromSupabase())
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats' }, (p) => {
                    if (p?.new) {
                        const m = { id: p.new.id, from: p.new.sender_name, to: p.new.receiver_name, text: p.new.message_text, time: p.new.sent_time || '' };
                        db.chats.push(m);
                        saveLocal();
                        updateBadges();
                        showChatPopup(m);
                    }
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, (p) => {
                    if (p?.new) {
                        const o = { id: p.new.order_code, customer: p.new.customer_name, merchant: p.new.merchant_name, driver: p.new.driver_name, items: p.new.items_summary, total: p.new.total_amount, status: p.new.status };
                        db.orders.unshift(o);
                        saveLocal();
                        showOrderPopup(o);
                    }
                })
                .subscribe();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initRealtime();
            pullFromSupabase();
            const sess = localStorage.getItem('oleng_user_session');
            if (sess) {
                currentUser = JSON.parse(sess);
                enterDashboard();
            }
            setInterval(() => {
                if (currentUser) pullFromSupabase();
            }, 4000);
        });
    </script>
</body>
