        <!-- Interactive Cart & Checkout Modal with Distance Sorting & Map -->
        <div id="modal-cart" class="absolute inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex flex-col justify-end">
            <div class="bg-white rounded-t-3xl p-6 max-h-[90vh] overflow-y-auto space-y-4 shadow-2xl">
                <div class="flex justify-between items-center border-b pb-3">
                    <h3 class="font-extrabold text-base text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-cart-shopping text-sky-600"></i> Keranjang & Hitung Ongkir Akurat
                    </h3>
                    <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>
                
                <!-- Pilihan Lokasi Tujuan di Lengkong dengan Simulasi Peta -->
                <div class="bg-sky-50/80 p-3.5 rounded-2xl border border-sky-100 space-y-2">
                    <label class="text-[11px] font-extrabold text-sky-800 uppercase tracking-wider block">
                        <i class="fa-solid fa-map-location-dot text-sky-600"></i> Pilih Lokasi Tujuan Anda di Lengkong
                    </label>
                    <select id="delivery-destination" onchange="recalculateShipping()" class="w-full p-2.5 bg-white border border-sky-200 rounded-xl text-xs font-bold text-slate-800 shadow-xs">
                        <option value="-7.1234,106.8456,Alun-Alun Lengkong">Alun-Alun Lengkong (0.5 km)</option>
                        <option value="-7.1290,106.8520,Kp. Cijangkar Lengkong">Kp. Cijangkar (2.1 km)</option>
                        <option value="-7.1150,106.8320,Desa Lengkong Kulon">Desa Lengkong Kulon (3.8 km)</option>
                        <option value="-7.1400,106.8650,Kp. Lebaksari Lengkong">Kp. Lebaksari (5.2 km)</option>
                    </select>
                    <!-- Mini Peta Preview di Keranjang -->
                    <div id="cart-map-preview" class="w-full h-28 rounded-xl border border-sky-200 mt-2"></div>
                </div>

                <!-- List Ojek Online Terdekat (Otomatis Sortir Jarak Terdekat di Atas) -->
                <div class="bg-yellow-50/80 p-3.5 rounded-2xl border border-yellow-200 space-y-2">
                    <label class="text-[11px] font-extrabold text-yellow-900 uppercase tracking-wider block">
                        <i class="fa-solid fa-motorcycle text-yellow-600 mr-1"></i> Pilih Ojek Online Terdekat (Urut Jarak)
                    </label>
                    <select id="checkout-driver-select" class="w-full p-2.5 bg-white border border-yellow-300 rounded-xl text-xs font-bold text-slate-800 shadow-xs">
                        <!-- Diisi otomatis oleh JavaScript berdasarkan urutan jarak terdekat -->
                    </select>
                </div>

                <!-- Daftar Item Keranjang -->
                <div id="cart-items-container" class="space-y-2 divide-y divide-slate-100 max-h-40 overflow-y-auto pr-1"></div>

                <!-- Rincian Total Belanja & Ongkir -->
                <div class="bg-slate-50 p-4 rounded-2xl space-y-2 border border-slate-200">
                    <div class="flex justify-between text-xs font-medium">
                        <span class="text-slate-600">Subtotal Makanan</span>
                        <span id="cart-subtotal" class="font-bold text-slate-900">Rp 0</span>
                    </div>
                    <div class="flex justify-between text-xs font-medium">
                        <span class="text-slate-600" id="shipping-distance-label">Ongkir Berdasarkan Jarak</span>
                        <span id="cart-ongkir" class="font-bold text-sky-600">Rp 0</span>
                    </div>
                    <div class="flex justify-between text-sm border-t border-slate-200 pt-2 font-black text-slate-900">
                        <span>Total Pembayaran (Belanja + Ongkir)</span>
                        <span id="cart-total" class="text-sky-600 text-base">Rp 0</span>
                    </div>
                </div>

                <button onclick="submitOrder()" class="w-full py-3.5 bg-sky-600 hover:bg-sky-700 text-white font-extrabold rounded-2xl shadow-lg shadow-sky-600/30 transition text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check-to-slot"></i> Buat Pesanan Makanan Sekarang
                </button>
                <div class="text-center text-[9px] text-slate-400 font-bold uppercase tracking-widest pt-1">POWERED BY SIMADU</div>
            </div>
        </div>
