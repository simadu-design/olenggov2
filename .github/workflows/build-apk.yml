name: Build OLENG GO Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: Configure Capacitor for OLENG GO
        run: |
          rm -f capacitor.config.ts capacitor.config.js android/capacitor.config.ts android/capacitor.config.js
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <script>window.location.replace("https://olenggov2.vercel.app/");</script>
              <meta http-equiv="refresh" content="0;url=https://olenggov2.vercel.app/">
            </head>
            <body>
              <a href="https://olenggov2.vercel.app/">Buka OLENG GO</a>
            </body>
          </html>
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.simadugo.app",
            "appName": "OLENG GO",
            "webDir": "www",
            "server": {
              "url": "https://olenggov2.vercel.app/",
              "cleartext": true
            }
          }
          EOF

          if [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi

          if [ -d android ]; then
            npx cap sync android || true
            cp capacitor.config.json android/capacitor.config.json
            mkdir -p android/app/src/main/assets
            cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          fi

          mkdir -p android/capacitor-cordova-android-plugins
          if [ ! -f android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            cat << 'EOF' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          ext {
              cdvMinSdkVersion = 23
              cdvCompileSdkVersion = 36
              cdvTargetSdkVersion = 36
          }
          EOF
          fi

          if [ ! -f android/capacitor-cordova-android-plugins/build.gradle ]; then
            cat << 'EOF' > android/capacitor-cordova-android-plugins/build.gradle
          apply plugin: 'com.android.library'
          apply from: 'cordova.variables.gradle'

          android {
              namespace "com.simadugo.app.cordova.plugins"
              compileSdk 36

              defaultConfig {
                  minSdk 23
                  targetSdk 36
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }
          EOF
          fi

          if [ ! -f android/app/capacitor.build.gradle ]; then
            cat << 'EOF' > android/app/capacitor.build.gradle
          // GENERATED FILE - DO NOT EDIT
          android {
          }
          apply from: "../capacitor-cordova-android-plugins/cordova.variables.gradle"
          EOF
          fi

      - name: Configure AndroidManifest permissions and icon attributes
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            python3 - << 'EOF'
          import pathlib
          import re

          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")

          perms = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
              "android.permission.INTERNET",
          ]

          for perm in perms:
              line = f'<uses-permission android:name="{perm}" />'
              if perm not in txt:
                  if "<application" in txt:
                      txt = txt.replace("<application", f"{line}\n    <application", 1)
                  else:
                      txt = txt.replace("</manifest>", f"    {line}\n</manifest>", 1)

          if "<application" in txt:
              if 'android:icon=' in txt:
                  txt = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', txt, count=1)
              else:
                  txt = txt.replace("<application", '<application android:icon="@mipmap/ic_launcher"', 1)

              if 'android:roundIcon=' in txt:
                  txt = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher"', txt, count=1)
              else:
                  txt = txt.replace("<application", '<application android:roundIcon="@mipmap/ic_launcher"', 1)

          p.write_text(txt, encoding="utf-8")
          EOF
          fi

      - name: Ensure MainActivity matches manifest package and requests notification permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PKG="com.simadugo.app"
          if [ -f "$MANIFEST" ]; then
            FOUND_PKG=$(python3 -c 'import pathlib, re, sys; m=re.search(r"package=\"([^\"]+)\"", pathlib.Path(sys.argv[1]).read_text()); print(m.group(1) if m else "")' "$MANIFEST")
            if [ -n "$FOUND_PKG" ]; then
              PKG="$FOUND_PKG"
            fi
          fi
          echo "Target package: $PKG"

          PKG_DIR="android/app/src/main/java/$(echo "$PKG" | tr '.' '/')"
          mkdir -p "$PKG_DIR"
          MAIN_FILE="$PKG_DIR/MainActivity.java"

          cat << EOF > "$MAIN_FILE"
          package $PKG;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (Build.VERSION.SDK_INT >= 33) {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                                  != PackageManager.PERMISSION_GRANTED) {
                              ActivityCompat.requestPermissions(
                                      this,
                                      new String[]{Manifest.permission.POST_NOTIFICATIONS},
                                      1001
                              );
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

          find android/app/src/main/java -name "MainActivity.java" ! -path "$MAIN_FILE" -delete 2>/dev/null || true

      - name: Apply Olengorange2.png icon cleanly
        run: |
          ICON_SRC=$(find . -maxdepth 8 -iname "olengorange2.png" | head -n 1)
          echo "Icon source: ${ICON_SRC:-NOT_FOUND}"
          if [ -n "$ICON_SRC" ] && [ -d android/app/src/main/res ]; then
            export ICON_SRC
            python3 - << 'EOF'
          import os
          import pathlib
          import shutil

          src = pathlib.Path(os.environ["ICON_SRC"])
          res = pathlib.Path("android/app/src/main/res")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          try:
              from PIL import Image, ImageOps
              has_pil = True
          except Exception:
              has_pil = False

          if has_pil:
              with Image.open(src) as im:
                  rgba = im.convert("RGBA")
                  for folder, px in sizes.items():
                      target_dir = res / folder
                      target_dir.mkdir(parents=True, exist_ok=True)
                      inner_px = max(16, int(px * 0.72))
                      contained = ImageOps.contain(rgba, (inner_px, inner_px), method=Image.Resampling.LANCZOS)
                      canvas = Image.new("RGBA", (px, px), (13, 23, 41, 255))
                      offset = ((px - contained.width) // 2, (px - contained.height) // 2)
                      canvas.paste(contained, offset, contained)
                      for fname in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                          canvas.save(target_dir / fname, format="PNG")
          else:
              for folder in sizes:
                  target_dir = res / folder
                  target_dir.mkdir(parents=True, exist_ok=True)
                  for fname in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                      shutil.copy2(src, target_dir / fname)

          for anydpi_dir in res.glob("mipmap-anydpi*"):
              shutil.rmtree(anydpi_dir, ignore_errors=True)
          EOF
          fi

          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">OLENG GO<\/string>/g' android/app/src/main/res/values/strings.xml || true
            sed -i 's/<string name="title_activity_main">[^<]*<\/string>/<string name="title_activity_main">OLENG GO<\/string>/g' android/app/src/main/res/values/strings.xml || true
          fi

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          rm -rf app/build build
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLENG-GO-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
