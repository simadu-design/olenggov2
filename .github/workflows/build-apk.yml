name: Build OLENG GO Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: Configure Capacitor for OLENG GO
        run: |
          rm -f capacitor.config.ts capacitor.config.js android/capacitor.config.ts android/capacitor.config.js
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <script>window.location.replace("https://olenggov2.vercel.app/");</script>
              <meta http-equiv="refresh" content="0;url=https://olenggov2.vercel.app/">
            </head>
            <body>
              <a href="https://olenggov2.vercel.app/">Buka OLENG GO</a>
            </body>
          </html>
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.simadugo.app",
            "appName": "OLENG GO",
            "webDir": "www",
            "server": {
              "url": "https://olenggov2.vercel.app/",
              "cleartext": true
            }
          }
          EOF

          if [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi

          if [ -d android ]; then
            npx cap sync android || true
            cp capacitor.config.json android/capacitor.config.json
            mkdir -p android/app/src/main/assets
            cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          fi

          mkdir -p android/capacitor-cordova-android-plugins
          if [ ! -f android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            cat << 'EOF' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          ext {
              cdvMinSdkVersion = 23
              cdvCompileSdkVersion = 36
              cdvTargetSdkVersion = 36
          }
          EOF
          fi

          if [ ! -f android/capacitor-cordova-android-plugins/build.gradle ]; then
            cat << 'EOF' > android/capacitor-cordova-android-plugins/build.gradle
          apply plugin: 'com.android.library'
          apply from: 'cordova.variables.gradle'

          android {
              namespace "com.simadugo.app.cordova.plugins"
              compileSdk 36

              defaultConfig {
                  minSdk 23
                  targetSdk 36
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }
          EOF
          fi

          if [ ! -f android/app/capacitor.build.gradle ]; then
            cat << 'EOF' > android/app/capacitor.build.gradle
          // GENERATED FILE - DO NOT EDIT
          android {
          }
          apply from: "../capacitor-cordova-android-plugins/cordova.variables.gradle"
          EOF
          fi

      - name: Ensure MainActivity matches manifest package
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PKG="com.simadugo.app"
          if [ -f "$MANIFEST" ]; then
            FOUND_PKG=$(python3 -c 'import pathlib, re, sys; m=re.search(r"package=\"([^\"]+)\"", pathlib.Path(sys.argv[1]).read_text()); print(m.group(1) if m else "")' "$MANIFEST")
            if [ -n "$FOUND_PKG" ]; then
              PKG="$FOUND_PKG"
            fi
          fi
          echo "Target package: $PKG"

          PKG_DIR="android/app/src/main/java/$(echo "$PKG" | tr '.' '/')"
          mkdir -p "$PKG_DIR"
          MAIN_FILE="$PKG_DIR/MainActivity.java"

          cat << EOF > "$MAIN_FILE"
          package $PKG;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {}
          EOF

          find android/app/src/main/java -name "MainActivity.java" ! -path "$MAIN_FILE" -delete 2>/dev/null || true

      - name: Apply Olengorange2.png icon cleanly
        run: |
          ICON_SRC=$(find . -maxdepth 8 -iname "olengorange2.png" | head -n 1)
          echo "Icon source: ${ICON_SRC:-NOT_FOUND}"
          if [ -n "$ICON_SRC" ] && [ -d android/app/src/main/res ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "android/app/src/main/res/$dir"
              cp "$ICON_SRC" "android/app/src/main/res/$dir/ic_launcher.png"
              cp "$ICON_SRC" "android/app/src/main/res/$dir/ic_launcher_round.png"
              cp "$ICON_SRC" "android/app/src/main/res/$dir/ic_launcher_foreground.png"
            done
          fi

          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">OLENG GO<\/string>/g' android/app/src/main/res/values/strings.xml || true
            sed -i 's/<string name="title_activity_main">[^<]*<\/string>/<string name="title_activity_main">OLENG GO<\/string>/g' android/app/src/main/res/values/strings.xml || true
          fi

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          rm -rf app/build build
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLENG-GO-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
